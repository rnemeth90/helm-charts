replicaCount: 1

image:
  repository: mpepping/cyberchef
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  host: cyberchef.geekyryan.lan
  path: /
  pathType: ImplementationSpecific
  tls:
    secretName: cyberchef-tls
