apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: "*"
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
          hosts:
            - host: headlamp.geekyryan.lan
              paths:
                - path: /
                  type: ImplementationSpecific
          tls:
            - secretName: headlamp-tls
              hosts:
                - headlamp.geekyryan.lan
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  ignoreDifferences:
    # This cluster's API server doesn't persist the `hostUsers` PodSpec field
    # (user-namespace isolation toggle) that the chart always sets, causing a
    # perpetual (harmless) diff. Ignore it.
    - group: apps
      kind: Deployment
      name: headlamp
      namespace: headlamp
      jqPathExpressions:
        - .spec.template.spec.hostUsers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
