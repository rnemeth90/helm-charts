replicaCount: 1

image:
  repository: aschil/snake
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  host: snake.geekyryan.lan
  path: /
  pathType: ImplementationSpecific
  tls:
    secretName: snake-tls
